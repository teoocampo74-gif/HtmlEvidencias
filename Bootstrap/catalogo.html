<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo Servicios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #f8f9fa;
            color: #333;
        }

        .navbar-custom {
            background-color: black;
        }

        .hero-section {
            background-color: #92959a;
            color: white;
            padding: 3rem 2rem;
            border-radius: 15px;
        }
        .navbar-nav .btn {
            color: #f8f9fa;
            text-align: left;
        }
    </style>    
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
            <div class="container">
                <!-- Logo -->
                <a class="navbar-brand fw-bold fs-4" href="#">
                    BarberPro
                </a>

                <!-- Botón hamburguesa para móviles -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Elementos de la barra -->
                <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
                    
                    <!-- Enlaces principales a la izquierda/centro -->
                    <ul class="navbar-nav gap-2 mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active px-3 rounded-pill bg-primary text-white" href="#">
                                Inicio
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="btn" href="#servicios">
                                Servicios
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="btn" href="barberos.html">
                                Barberos
                            </a>
                        </li>

                        <!-- Dropdown 1: Administrador -->
                        <li class="nav-item dropdown">
                            <a class="btn dropdown-toggle" data-bs-toggle="dropdown" href="#" role="button" aria-expanded="false">
                                Administrador
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="empleados.html">Empleados</a></li>
                                <li><a class="dropdown-item" href="#">Ventas</a></li>
                            </ul>
                        </li>

                        <!-- Dropdown 2: Gestión (Nuevo desplegable estilo grown down) -->
                        <li class="nav-item dropdown">
                            <a class="btn dropdown-toggle" data-bs-toggle="dropdown" href="#" role="button" aria-expanded="false">
                                Gestión
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#">Citas</a></li>
                                <li><a class="dropdown-item" href="#">Catálogo Servicios</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item" href="#">Inventario</a></li>
                            </ul>
                        </li>
                    </ul>

                    <!-- Barra de búsqueda y Login a la derecha -->
                    <div class="d-flex align-items-center gap-3">
                        <!-- Barra de búsqueda -->
                        <form class="d-flex" role="search">
                            <input class="form-control form-control-sm me-2" type="search" placeholder="Buscar..." aria-label="Search">
                            <button class="btn btn-outline-light btn-sm" type="submit">Buscar</button>
                        </form>

                        <!-- Botón Login -->
                        <a class="btn btn-outline-primary btn-sm text-nowrap" data-bs-toggle="modal" data-bs-target="#myModal" href="#">
                            Iniciar sesión
                        </a>

                         <a class="btn btn-outline-primary btn-sm text-nowrap" data-bs-toggle="modal" data-bs-target="#myModal" href="#">
                            Registrarse
                        </a>
                    </div>

                </div>
            </div>
        </nav>
    </header>
    <main>
        <div id="demo" class="carousel slide" data-bs-ride="carousel">

  <!-- Indicators/dots -->
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
    <button type="button" data-bs-target="#demo" data-bs-slide-to="1"></button>
    <button type="button" data-bs-target="#demo" data-bs-slide-to="2"></button>
  </div>

  <!-- The slideshow/carousel -->
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="" alt="Los Angeles" class="d-block w-100">
    </div>
    <div class="carousel-item">
      <img src="chicago.jpg" alt="Chicago" class="d-block w-100">
    </div>
    <div class="carousel-item">
      <img src="ny.jpg" alt="New York" class="d-block w-100">
    </div>
  </div>

  <!-- Left and right controls/icons -->
  <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
  </button>
</div>
    </main>
</body>
</html>
