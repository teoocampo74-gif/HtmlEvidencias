<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaQueri</title>
</head>
<style>
    .banner-img {
        width: 100%;
        height: 300px;
        object-fit: cover ;
    }

    .hero{
        background-image: url(lamborghini.jpg);
        background-size: cover;
        background-position: center;
        height: 100vh;
    }

    .hero::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.4);
    }
</style>
<body>
    
    <section class="hero">
        <h1>hola</h1>

    </section>
    
    
    <article class="banner">
    <img 
    src="lamborghini.jpg"
    srcset="lamborghini.jpg 320w, lamborghini-768.jpg 768w"
    sizes="(max-width: 600px) 100vw, 50vw"
     alt="ejemplo">
    </article>

</body>
</html>
