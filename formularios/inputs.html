<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inputs</title>
</head>
<body>
    <input type="button" value="click me" onclick="alert('Hola como estas')">
    <label for="">YO</label><input type="checkbox">
    <br><br>
    <input type="date">
    <br><br>
    <input type="datetime-local">
    <br><br>
    <input type="email">
    <br><br>
    <input type="file" accept="application/.pdf,.excel,.word">
    <br><br>
    <input type="hidden">
    <br><br>
    <input type="image">
    <br><br>
    <input type="number">
    <br><br>
    <input type="range">
    <br><br>
    <input type="time">
    <br><br>
    <input type="reset">
    <br><br>
    <input type="search" name="consulta"
    placeholder="Buscar..."
    autocomplete="off"
    results="5">
    <br><br>
    <input type="number" pattern="[0-9]*" inputmode="numeric" name="edad"
    min="10" max="18"
    step="1"
    required>
    <br><br>
    <input type="tel" name="telefono"
    placeholder="+52 123 456 7890"
    autocomplete="tel">
    <br><br>
    <input type="range" writing mode:  name="volumen"
    min="0" max="100"
    step="5">
    <br><br>
    <input type="checkbox" id="noticias" name="preferencias" value="noticias">
    <label for="noticias">Recibir noticias</label>
    <br><br>
    <input type="checkbox" name="preferencias" value="eventos">
    <label for="eventos">Recibir invitaciones</label>
    <br><br>
    <input type="week">
    <br><br>
    <input type="month">
    <br><br>
    <input type="date" name="cita"
    min="2026-08-24">
    <br><br>
    <input type="date" name="viaje"
    min="2026-08-24"
    max="2026-12-31">
    <br><br>
    <input type="time" name="alarma"
    min="08:00"
    max="18:00">
    <br><br>
    <input type="datetime-local" name="evento"
    min="2026-06-13T09:00"
    max="2026-12-31T23:59">
    <br><br>
    

</body>
</html>
